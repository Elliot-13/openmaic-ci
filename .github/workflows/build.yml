name: build

# OpenMAIC 镜像云端构建：源码从上游拉，Dockerfile 用本仓库里改好的那份
# 触发：手动 / 每周一 04:00（CST）/ 改本仓库文件

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '上游 git ref（分支或 tag）'
        required: false
        default: 'main'
  schedule:
    - cron: '0 20 * * 0'   # 每周日 20:00 UTC = 周一 04:00 CST
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.github/workflows/build.yml'

env:
  UPSTREAM: https://github.com/THU-MAIC/OpenMAIC.git
  # GHCR 要求镜像名全小写；github.repository_owner 带大写（Elliot-13）会报 invalid tag
  IMAGE: ghcr.io/elliot-13/openmaic

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout 本仓库（Dockerfile）
        uses: actions/checkout@v4

      - name: 拉取上游源码
        run: |
          REF="${{ github.event.inputs.ref || 'main' }}"
          echo "building upstream ref: $REF"
          git clone --depth 1 --branch "$REF" "$UPSTREAM" upstream
          git -C upstream log -1 --format='commit=%h date=%ad' --date=short

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ./upstream
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.run_number }}
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: 摘要
        run: |
          echo "### 构建完成" >> "$GITHUB_STEP_SUMMARY"
          echo "- 镜像: \`${{ env.IMAGE }}:latest\`（含 \`:${{ github.run_number }}\`）" >> "$GITHUB_STEP_SUMMARY"
          echo "- 上游 ref: \`${{ github.event.inputs.ref || 'main' }}\`" >> "$GITHUB_STEP_SUMMARY"
